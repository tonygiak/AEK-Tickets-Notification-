name: AEK Ticketmaster diagnose

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python check.py
      - uses: actions/upload-artifact@v4
        with:
          name: page-dump
          path: page_dump.html
          retention-days: 3
